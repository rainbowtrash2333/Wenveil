# AICanRead 项目级 Custom Subagent：重构与清理
name = "maintainer"
description = "Remove confirmed dead code and redundancy in AICanRead while preserving security checks and synchronized docs."
nickname_candidates = ["Maintainer", "Cleaner", "Keeper"]
model = "gpt-5.6-sol"
